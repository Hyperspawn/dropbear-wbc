<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropbear Live</title>
<style>
  :root {
    --bg: #0f1216; --panel: rgba(20, 24, 30, 0.82); --line: rgba(255, 255, 255, 0.10);
    --text: #e8ebef; --muted: #9aa3ad; --accent: #f2b33d; --ok: #58c48b; --warn: #e8a13a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); }
  #status { top: 16px; left: 16px; padding: 12px 14px; min-width: 260px; max-width: calc(100vw - 32px); }
  #status h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; letter-spacing: .2px; }
  #status h1 span { color: var(--accent); }
  .row { display: flex; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .row b { color: var(--text); font-weight: 500; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--ok); } .dot.wait { background: var(--warn); }
  #events { margin-top: 10px; display: grid; gap: 4px; max-height: 40vh; overflow: auto; }
  .ev { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; }
  .ev .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .s { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev .s.done { color: var(--ok); }
  #ask { left: 50%; transform: translateX(-50%); bottom: 16px; width: min(720px, calc(100vw - 32px)); padding: 10px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #1b1407; border: 0; border-radius: 8px; padding: 0 16px; font: inherit;
    font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; font-weight: 400; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  #note { position: fixed; right: 16px; top: 16px; max-width: 300px; padding: 10px 12px; font-size: 12px;
    color: var(--muted); }
  @media (max-width: 700px) { #note { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="status" class="panel">
  <h1>Dropbear <span>live</span> · motor twin</h1>
  <div class="row"><span><i id="pdot" class="dot"></i><b id="pstate">waiting for physics</b></span></div>
  <div class="row"><span>sim <b id="simt">–</b> s</span><span>rate <b id="rtf">–</b>×</span><span>view <b id="fps">–</b> fps</span></div>
  <div id="events"></div>
</div>
<div id="note" class="panel">Physics: Isaac Lab PhysX on the CPU, datasheet motor models, 27 loop closures, 200 Hz, paced to real time.
  Motions: Kimodo-G1 text-to-motion, retargeted to Dropbear. What you see is the simulated robot, not the reference.</div>
<div id="ask" class="panel">
  <form id="f"><input id="q" placeholder="Describe a motion… e.g. a person waves hello with the right hand" autocomplete="off">
    <button id="go">Send</button></form>
  <div class="chips">
    <button class="chip" type="button">a person waves hello with the right hand</button>
    <button class="chip" type="button">5|a person walks forward slowly</button>
    <button class="chip" type="button">a person does a shallow squat</button>
    <button class="chip" type="button">a person turns to the left</button>
    <button class="chip" type="button">a person raises both arms</button>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151a21);
scene.fog = new THREE.Fog(0x151a21, 12, 40);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 200);
camera.position.set(2.6, 1.2, 2.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x2a2f36, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 6, 2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 });
scene.add(key, key.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(200, 200, 0x46505c, 0x363d46); grid.position.y = 0.001; scene.add(grid);

// the physics is Z-up; three.js is Y-up
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);
const nodes = {};
let names = null;
new GLTFLoader().load("/dropbear.glb", (g) => {
  for (const n of [...g.scene.children]) {
    n.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.material.roughness = 0.55; o.material.metalness = 0.05; } });
    world.add(n); nodes[n.name] = n; n.visible = false;
  }
});

const el = (id) => document.getElementById(id);
let last = { seq: -1, t: 0, wall: 0 }, rtf = null, frames = 0, fpsT = performance.now();
const centroid = new THREE.Vector3(), prevCentroid = new THREE.Vector3();
let haveCentroid = false, inflight = false;

async function poll() {
  if (inflight) return; inflight = true;
  try {
    const r = await fetch(names ? "/state" : "/state?names=1", { cache: "no-store" });
    const s = await r.json();
    if (s.names) names = s.names;
    if (s.seq !== undefined && names && s.seq !== last.seq) {
      const now = performance.now() / 1000;
      if (last.seq > 0 && s.t > last.t) { const r1 = (s.t - last.t) / (now - last.wall); rtf = rtf === null ? r1 : 0.9 * rtf + 0.1 * r1; }
      if (s.t < last.t) rtf = null;
      last = { seq: s.seq, t: s.t, wall: now };
      let cx = 0, cy = 0, cz = 0, k = 0;
      for (let i = 0; i < names.length; i++) {
        const n = nodes[names[i]]; if (!n) continue;
        const x = s.p[3 * i], y = s.p[3 * i + 1], z = s.p[3 * i + 2];
        n.position.set(x, y, z);
        n.quaternion.set(s.q[4 * i + 1], s.q[4 * i + 2], s.q[4 * i + 3], s.q[4 * i]);
        n.visible = true; cx += x; cy += y; cz += z; k++;
      }
      if (k) {
        centroid.set(cx / k, cz / k, -cy / k);  // Z-up -> Y-up
        if (haveCentroid) {  // carry the camera with the robot, keep the user's orbit
          const d = centroid.clone().sub(prevCentroid); d.y = 0;
          camera.position.add(d); controls.target.add(d);
        } else { controls.target.copy(centroid); camera.position.set(centroid.x + 2.6, 1.3, centroid.z + 2.6); }
        prevCentroid.copy(centroid); haveCentroid = true;
        key.position.set(centroid.x + 3, 6, centroid.z + 2); key.target.position.copy(centroid);
      }
      el("simt").textContent = s.t.toFixed(1);
      el("rtf").textContent = rtf === null ? "–" : rtf.toFixed(2);
    }
  } catch (e) { /* server restarting */ }
  inflight = false;
}

async function events() {
  try {
    const e = await (await fetch("/events", { cache: "no-store" })).json();
    const ph = e.physics || {};
    const fresh = performance.now() / 1000 - last.wall < 1.5;
    el("pdot").className = "dot " + (fresh ? "on" : ph.armed ? "wait" : "");
    el("pstate").textContent = fresh ? "physics running" : ph.finished ? "physics finished" : ph.armed ? "physics armed" : "waiting for physics";
    el("events").innerHTML = (e.prompts || []).slice().reverse().map((p) => {
      const st = p.refused ? "refused" : p.splice_s !== null ? `playing · ${p.splice_s}s` : p.clip_s !== null ? `clip ready · ${p.clip_s}s` : `generating · ${p.age_s}s`;
      const tip = (p.text + (p.gate ? " — " + p.gate : "")).replace(/"/g, "&quot;");
      return `<div class="ev" title="${tip}"><span class="t">${p.text.replace(/</g, "&lt;")}</span><span class="s ${p.splice_s !== null ? "done" : ""}" style="${p.refused ? "color:var(--warn)" : ""}">${st}</span></div>`;
    }).join("");
  } catch (e) { /* ignore */ }
}

async function send(text) {
  text = text.trim(); if (!text) return;
  el("go").disabled = true;
  try { await fetch("/prompt", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) }); }
  finally { el("go").disabled = false; }
  events();
}
el("f").addEventListener("submit", (ev) => { ev.preventDefault(); send(el("q").value); el("q").value = ""; });
for (const c of document.querySelectorAll(".chip")) c.addEventListener("click", () => send(c.textContent));

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setInterval(poll, 33);
setInterval(events, 500);
renderer.setAnimationLoop(() => {
  controls.update(); renderer.render(scene, camera); frames++;
  const now = performance.now(); if (now - fpsT > 1000) { el("fps").textContent = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
});
</script>
</body>
</html>
