[pytest]
# A bare `pytest` from the repo root collects only tests/. Without this,
# pytest also collects tools/hw_stand_test.py (an Isaac Lab script, not a
# test) and aborts collection off-Isaac with ModuleNotFoundError: isaaclab.
testpaths = tests
pythonpath = .
norecursedirs = .git .locks .github __pycache__ data docs logs requirements scripts site source third_party tools
